services:
  db:
    image: postgis/postgis:17-3.5-alpine
    container_name: tashmetrio-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tashmetrio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tashmetrio}
      POSTGRES_DB: ${POSTGRES_DB:-tashmetrio}
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - tashmetrio_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tashmetrio} -d ${POSTGRES_DB:-tashmetrio}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: tashmetrio-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6378}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  tashmetrio_pgdata: